name: Verify binaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checksums
        run: cd bin && sha256sum -c SHA256SUMS

      - name: Attestations and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sources=(engine mise.toml scripts/build-engine.sh)
          strict=0
          [[ $GITHUB_EVENT_NAME == workflow_dispatch || $GITHUB_REF == refs/tags/* ]] && strict=1
          bundle=()
          [[ -f bin/provenance.sigstore.json ]] && bundle=(--bundle bin/provenance.sigstore.json)
          for file in bin/engine; do
            gh attestation verify "$file" "${bundle[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-engine.yml" \
              --format json > attestations.json
            matched=0
            for commit in $(jq -r '.. | .sourceRepositoryDigest? // empty' attestations.json | sort -u); do
              same=1
              for path in "${sources[@]}"; do
                [[ "$(git rev-parse "$commit:$path" 2>/dev/null)" == "$(git rev-parse "HEAD:$path")" ]] || same=0
              done
              if [[ $same == 1 ]]; then
                echo "$file: built from $commit, same sources as HEAD"
                matched=1
                break
              fi
            done
            if [[ $matched == 0 ]]; then
              if [[ $strict == 1 ]]; then
                echo "::error::$file was not built from the current engine sources"
                exit 1
              fi
              echo "::warning::$file was not built from the current engine sources yet; Build engine rebuilds it after the push to main"
            fi
          done
