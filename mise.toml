[tools]
rust = "1.98.0"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"github:EmbarkStudios/cargo-about" = "0.9.2"
uv = "0.13.7"

[env]
CARGO_TARGET_DIR = "{{env.HOME}}/.cache/openmausbot-engine/target"

[tasks.build]
description = "Build the engine into bin/engine.local (git ignores it; bin/run-engine uses it while it matches manifest.json)"
run = "scripts/build-engine.sh"

[tasks.test]
description = "Run the engine's unit and integration tests and the translation check"
run = [
    "cargo test --locked --manifest-path engine/Cargo.toml",
    "node scripts/check-i18n.mjs",
    "node scripts/check-settings.mjs",
    "scripts/check-silent.sh",
]

[tasks.i18n]
description = "Check that every lang/*.js has the same keys, and that the QML reads them all"
run = "node scripts/check-i18n.mjs"

[tasks.fixtures]
description = "Regenerate engine/tests/fixtures (timestamps relative to now)"
run = "scripts/make-fixtures.sh"

[tasks.audit]
description = "Check the crates for advisories, licences and sources"
run = "cargo-deny --manifest-path engine/Cargo.toml check"

[tasks.licenses]
description = "Regenerate licenses/THIRD-PARTY.txt from the crates linked into the engine plus the ported Open Bot Avatar code"
run = "scripts/licenses.sh"

[tasks.snapshot]
description = "Print one snapshot from the local build"
run = "bin/engine.local --once | jq ."

[tasks.validate]
description = "Validate the plugin manifest"
run = "omarchy plugin validate ."

[tasks.preview]
description = "Render preview.png (marketplace still) and preview.webp (README, with the animated crew) from assets/presentation.pptx"
run = "uv run --script scripts/make-preview.py"

[tasks.publish]
description = "Tag the commit, push the tag to Forgejo, wait for the GitHub Release, then fast-forward main on Forgejo"
run = "scripts/publish.sh"
